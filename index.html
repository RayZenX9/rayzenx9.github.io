<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>RayZenX | Host PS4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
(function () {
    var uaFull = navigator.userAgent;
    var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Desconhecido";
    var fwNum = parseFloat(fwVersion);

    function showMessage(message) {
        var element = document.getElementById("msgs");
        if (element) {
            element.textContent = message;
        }
    }

    function onScriptError() {
        showMessage(
            "Arquivo não encontrado! Verifique os arquivos do host e o cache do navegador."
        );
    }

    function loadScript(src, isModule, onLoad) {
        var script = document.createElement("script");
        script.src = src;

        if (isModule) {
            script.type = "module";
        }

        script.onerror = onScriptError;

        if (onLoad) {
            script.onload = onLoad;
        }

        document.head.appendChild(script);
    }

    function initializeHost() {
        if (!isPS4) {
            showMessage(
                "Disponível somente para PS4 com firmware 5.05 ou versões de 7.00 a 14.02."
            );
            return;
        }

        if (fwNum === 5.05 || fwNum === 5.07) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cache505.html");
                return;
            }

            loadScript("505/exploit.js", false);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cache700.html");
                return;
            }

            loadScript("700/alert.js", true);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cache900.html");
                return;
            }

            loadScript("900/alert.js", true);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cachecss.html");
                return;
            }

            loadScript("css/main.js", false, function () {
                setTimeout(function () {
                    if (typeof doJb === "function") {
                        doJb();
                    } else {
                        showMessage(
                            "Não foi possível iniciar o desbloqueio."
                        );
                    }
                }, 500);
            });
        }
        else if (fwNum === 11.50 || fwNum === 11.52) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cacheslopkit.html");
                return;
            }

            loadScript("slopkit/chain_lapse.js", true);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            if (window.applicationCache.status === 0) {
                window.location.replace("cacheslopkit.html");
                return;
            }

            loadScript("slopkit/jb.js", true);
        }
        else {
            showMessage("Firmware não compatível: " + fwVersion);
        }
    }

    document.addEventListener("DOMContentLoaded", initializeHost);
})();
</script>

<h1>RayZenX</h1>
<hr>
<br>

<h1 id="msgs"
    style="font-size:30px; margin-top:77px; margin-bottom:455px;">
    Inicializando o host... Aguarde.
</h1>

</body>
</html>
