<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">

    <title>RayZenX — PS4 Multi Firmware</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>SEU CONSOLE DESBLOQUEADO</h1>

        <hr>

        <p class="subtitle">Ambiente RayZenX Multi Firmware</p>

        <div id="msgs">
            Seu sistema será identificado e o desbloqueio será iniciado.
        </div>

        <p id="firmware">
            Identificando firmware...
        </p>

        <button id="startBtn" type="button">
            ✕ &nbsp; APERTE X PARA COMEÇAR
        </button>

        <div id="progressArea" style="display:none;">
            <p id="status" aria-live="polite">
                Preparando o ambiente...
            </p>

            <progress id="progressBar" value="0" max="100"></progress>

            <div id="progressText">0%</div>
        </div>

        <hr>

        <p>
            <small>RAYZENX · MULTI FIRMWARE</small>
        </p>
    </main>

    <script>
    (() => {
        "use strict";

        const $ = id => document.getElementById(id);

        const messages = $("msgs");
        const firmwareLabel = $("firmware");
        const button = $("startBtn");
        const progressArea = $("progressArea");
        const progressBar = $("progressBar");
        const progressText = $("progressText");
        const status = $("status");

        let started = false;

        const match = navigator.userAgent.match(
            /PlayStation 4[ /]([\d.]+)/i
        );

        const firmware = match ? match[1] : null;
        const version = firmware ? parseFloat(firmware) : NaN;

        let config = null;

        if (firmware) {
            if (version === 5.05 || version === 5.07) {
                config = {
                    cache: "cache505.html",
                    script: "505/exploit.js",
                    module: false
                };
            } else if (version >= 7.00 && version <= 8.52) {
                config = {
                    cache: "cache700.html",
                    script: "700/alert.js",
                    module: true
                };
            } else if (version >= 9.00 && version <= 9.60) {
                config = {
                    cache: "cache900.html",
                    script: "900/alert.js",
                    module: true
                };
            } else if (version >= 10.00 && version <= 11.02) {
                config = {
                    cache: "cachecss.html",
                    script: "css/main.js",
                    module: false,
                    runDoJb: true
                };
            } else if (version === 11.50 || version === 11.52) {
                config = {
                    cache: "cacheslopkit.html",
                    script: "slopkit/chain_lapse.js",
                    module: true
                };
            } else if (version >= 12.00 && version <= 14.02) {
                config = {
                    cache: "cacheslopkit.html",
                    script: "slopkit/jb.js",
                    module: true
                };
            }
        }

        if (!match) {
            firmwareLabel.textContent = "Console não identificado";
            messages.textContent =
                "Abra o RayZenX pelo navegador do seu PS4.";
            button.disabled = true;
            button.textContent = "NAVEGADOR NÃO IDENTIFICADO";
        } else if (!config) {
            firmwareLabel.textContent =
                "Firmware detectado: " + firmware;
            messages.textContent =
                "Este firmware não está disponível neste host.";
            button.disabled = true;
            button.textContent = "FIRMWARE NÃO SUPORTADO";
        } else {
            firmwareLabel.textContent =
                "Firmware detectado: " + firmware;
        }

        function updateProgress(value, text) {
            const percentage = Math.max(
                0,
                Math.min(100, Math.round(value))
            );

            progressBar.value = percentage;
            progressText.textContent = percentage + "%";

            if (text) {
                status.textContent = text;
            }
        }

        function showError(message) {
            messages.textContent = "Não foi possível continuar.";
            status.textContent = message;
            button.disabled = false;
            button.classList.remove("hidden");
            button.style.display = "inline-block";
            started = false;
        }

        function startHost() {
            if (started || !config) return;

            started = true;
            button.disabled = true;
            button.style.display = "none";
            progressArea.style.display = "block";

            messages.textContent =
                "Identificando sistema e preparando o desbloqueio...";

            updateProgress(5, "Verificando o ambiente...");

            /*
             * Mantém o comportamento do host original:
             * se o cache ainda não estiver instalado, abre
             * a página de cache correspondente ao firmware.
             */
            try {
                const appCache = window.applicationCache;

                if (
                    appCache &&
                    appCache.status === appCache.UNCACHED
                ) {
                    status.textContent =
                        "Preparando cache. Siga as instruções da próxima tela.";
                    window.location.href = config.cache;
                    return;
                }
            } catch (error) {
                // Continua tentando carregar o host.
            }

            loadExploit();
        }

        function loadExploit() {
            messages.textContent =
                "O desbloqueio está sendo iniciado. Aguarde...";

            updateProgress(15, "Carregando os componentes do host...");

            const script = document.createElement("script");

            script.src = config.script;
            script.async = true;

            if (config.module) {
                script.type = "module";
            }

            script.onload = () => {
                updateProgress(
                    100,
                    "Arquivo carregado. Aguardando o resultado do processo..."
                );

                messages.textContent =
                    "Componentes carregados. Aguarde a execução do desbloqueio.";

                /*
                 * Carregar o JavaScript não comprova que o
                 * desbloqueio foi concluído.
                 */
                if (config.runDoJb) {
                    if (typeof window.doJb === "function") {
                        try {
                            window.doJb();

                            status.textContent =
                                "Processo iniciado. Aguardando confirmação do host.";
                        } catch (error) {
                            showError(
                                "Ocorreu um erro durante a execução. Verifique o script do firmware."
                            );
                        }
                    } else {
                        status.textContent =
                            "Arquivo carregado, mas a função de inicialização não foi encontrada.";
                    }
                }
            };

            script.onerror = () => {
                updateProgress(0, "Falha ao carregar o arquivo.");

                showError(
                    "Não foi possível carregar " + config.script +
                    ". Confira se o arquivo existe no projeto."
                );
            };

            document.body.appendChild(script);
        }

        /*
         * Ponto de integração opcional:
         * o exploit precisa chamar esta função após confirmar
         * realmente o sucesso para exibir a mensagem final.
         */
        window.rayzenxUnlockComplete = function() {
            messages.textContent = "DESBLOQUEIO CONCLUÍDO!";
            status.textContent =
                "Processo concluído. Aproveite seu console!";
            updateProgress(100, "Desbloqueio concluído");
        };

        button.addEventListener("click", startHost);

        document.addEventListener("keydown", event => {
            if (
                !started &&
                config &&
                (event.key === "Enter" || event.key === " ")
            ) {
                event.preventDefault();
                startHost();
            }
        });
    })();
    </script>
</body>
</html>
