<!DOCTYPE html>
<html lang="pt-BR" manifest="700.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>RayZenX | Instalação do Cache</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var Percent = Math.round(e.loaded / e.total * 100);
    window.msgs.innerHTML = "Instalando cache offline: " + Percent + "%";
}

function DisplayCacheProgress() {
    window.msgs.innerHTML = "Cache instalado com sucesso ✔";

    setTimeout(function() {
        window.msgs.innerHTML =
            "Agora feche e abra novamente o navegador.";
    }, 1500);
}

window.applicationCache.addEventListener("progress", DLProgress, false);

window.applicationCache.oncached = function(e) {
    DisplayCacheProgress();
};

window.applicationCache.onupdateready = function(e) {
    DisplayCacheProgress();
};

window.applicationCache.onerror = function(e) {
    window.msgs.innerHTML =
        "Erro ao instalar o cache! Feche e abra novamente o navegador.";
};
</script>

<h1>RayZenX</h1>
<hr>
<br>

<h1 id="msgs"
    style="font-size:30px; margin-top:77px; margin-bottom:455px;">
    Iniciando a instalação do cache...
</h1>

</body>
</html>
